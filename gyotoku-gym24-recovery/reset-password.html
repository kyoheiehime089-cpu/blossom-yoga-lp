<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://fplvstwmsewpqwrcsqrm.supabase.co; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>行徳ジム24｜管理者パスワードの再設定</title>
<link rel="stylesheet" href="../gyotoku-gym24-booking/admin-style.css?v=40">
</head>
<body>
<main class="wrap"><section class="panel">
<h1>管理者パスワードの再設定</h1>
<p id="recoveryStatus" role="status" aria-live="polite">回復手続きを確認しています。</p>
<form id="requestRecovery" hidden>
<label>既存の管理用メールアドレス<input name="email" type="email" autocomplete="email" required></label>
<p>メール内のリンクは、このブラウザーのこのタブで開いてください。リンクは他の人に送らないでください。</p>
<button class="btn" type="submit">再設定メールを送る</button>
</form>
<form id="updatePassword" hidden>
<label>新しいパスワード<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<label>新しいパスワード（確認）<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<label><input name="confirmed" type="checkbox" required> 自分の管理用アカウントのパスワードを変更します。</label>
<button class="btn" type="submit">新しいパスワードに変更する</button>
</form>
<p><a href="../gyotoku-gym24-booking/admin.html" rel="noreferrer">管理者画面へ</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0" referrerpolicy="no-referrer"></script>
<script src="../gyotoku-gym24-booking/supabase-config.js" referrerpolicy="no-referrer"></script>
<script type="module" src="./reset-password-ui.mjs"></script>
</body>
</html>
